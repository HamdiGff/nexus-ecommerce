    <rect x="0" y="208" width="280" height="106" rx="16" fill="#140f24"/>
    <rect x="0" y="208" width="280" height="106" rx="16" fill="none" stroke="#8b5cf6" stroke-width="1.5"/>
    <rect x="0" y="208" width="280" height="2" rx="1" fill="#a78bfa"/>
    <text x="18" y="234" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="12" font-weight="800" fill="#c084fc">ChatGPT Pro 1 Month</text>
    <text x="18" y="266" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="26" font-weight="900" fill="white">$149<tspan font-size="15" fill="#64748b">.99</tspan></text>
    <text x="125" y="266" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="12" fill="#475569" text-decoration="line-through">$200</text>
    <text x="18" y="286" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="10.5" fill="#a78bfa">Official Email Invite · No 2FA or Password</text>
    <text x="18" y="300" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="10" fill="#64748b">Unlimited GPT-4o &amp; OpenAI o1 Pro Mode</text>
    <rect x="172" y="220" width="94" height="20" rx="10" fill="#8b5cf6"/>
    <text x="181" y="234" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="8.5" font-weight="900" fill="white">OFFICIAL INVITE</text>

    <!-- Card 4: Plus 1 Year -->
    <rect x="0" y="324" width="280" height="76" rx="14" fill="url(#cardGrad)"/>
    <rect x="0" y="324" width="280" height="76" rx="14" fill="none" stroke="#1e293b" stroke-width="1"/>
    <text x="18" y="348" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" fill="#94a3b8">Plus 1 Year (Save 50%)</text>
    <text x="18" y="376" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="22" font-weight="900" fill="white">$119<tspan font-size="13" fill="#64748b">.99</tspan></text>
    <text x="110" y="376" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="11" fill="#475569" text-decoration="line-through">$240</text>
    <rect x="195" y="336" width="70" height="18" rx="9" fill="#38bdf8" opacity="0.15"/>
    <text x="204" y="349" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="8.5" font-weight="800" fill="#38bdf8">BEST VALUE</text>
  </g>

  <!-- Bottom Strip -->
  <rect x="0" y="460" width="800" height="40" fill="#050810"/>
  <line x1="0" y1="460" x2="800" y2="460" stroke="#10a37f" stroke-width="0.5" opacity="0.2"/>
  <text x="50" y="484" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="11" fill="#475569">OpenAI Official Platform  •  Delivered in 15–30 Mins to Your Personal Email  •  Full Warranty Guarantee</text>
  <text x="640" y="484" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="11" font-weight="800" fill="#10a37f">NEXUS DIGITAL</text>
</svg>
