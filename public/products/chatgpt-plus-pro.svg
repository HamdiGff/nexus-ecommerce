    <rect x="0" y="100" width="280" height="96" rx="16" fill="none" stroke="#10a37f" stroke-width="1.5"/>
    <rect x="0" y="100" width="280" height="2" rx="1" fill="#10a37f"/>
    <text x="18" y="126" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#10a37f">Plus 6 Months</text>
    <text x="18" y="158" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="26" font-weight="900" fill="white">$69<tspan font-size="15" fill="#64748b">.99</tspan></text>
