      <text x="162" y="15" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="9.5" font-weight="800" fill="#c084fc" letter-spacing="1">🛡 100% VALIDITY</text>
    </g>

    <!-- Left Features Checklist -->
    <g transform="translate(0, 140)">
      <rect x="0" y="0" width="380" height="200" rx="18" fill="url(#cardGrad)"/>
      <rect x="0" y="0" width="380" height="200" rx="18" fill="none" stroke="#1e293b" stroke-width="1"/>

      <text x="22" y="28" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="11" font-weight="800" fill="#64748b" letter-spacing="2">KEY ADVANTAGES</text>

      <g transform="translate(22, 45)">
