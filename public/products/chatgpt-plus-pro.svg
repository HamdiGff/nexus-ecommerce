      </g>
      <g transform="translate(22, 165)">
        <circle cx="6" cy="6" r="3" fill="#38bdf8"/>
        <text x="18" y="10" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Live Order Chat &amp; Ticket 2FA Assistance Support</text>
