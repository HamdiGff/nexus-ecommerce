      <circle cx="48" cy="48" r="36" fill="none" stroke="#10a37f" stroke-width="1.5" opacity="0.6"/>
      <path d="M48 18 C64 18, 78 32, 78 48 C78 64, 64 78, 48 78 C32 78, 18 64, 18 48" stroke="#10a37f" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M34 26 C45 20, 58 20, 66 28 C74 36, 76 48, 70 58" stroke="#10a37f" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.8"/>
      <circle cx="48" cy="48" r="5" fill="#10a37f"/>
    </g>

    <!-- Title & Brand -->
    <text x="110" y="38" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="28" font-weight="900" fill="white" letter-spacing="-1">ChatGPT</text>
    <text x="240" y="38" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="28" font-weight="900" fill="#10a37f" letter-spacing="-1">PLUS</text>
    <text x="320" y="38" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#6b7280">&amp;</text>
    <text x="345" y="38" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="28" font-weight="900" fill="#a78bfa" letter-spacing="-1">PRO</text>

    <!-- Subtitle -->
    <text x="110" y="62" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="1.5">OFFICIAL PERSONAL EMAIL ACTIVATION</text>

    <!-- Badges Row -->
    <g transform="translate(110, 76)">
      <rect x="0" y="0" width="140" height="22" rx="11" fill="#10a37f" opacity="0.15"/>
      <rect x="0" y="0" width="140" height="22" rx="11" fill="none" stroke="#10a37f" stroke-width="1" opacity="0.4"/>
