<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#0d1424"/>
      <stop offset="100%" stop-color="#081012"/>
    </linearGradient>
    <linearGradient id="gptGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10a37f"/>
      <stop offset="100%" stop-color="#1a7a5e"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141b2d"/>
      <stop offset="100%" stop-color="#0e1520"/>
    </linearGradient>
    <linearGradient id="glowLine" x1="0" y1="0" x2="800" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="40%" stop-color="#10a37f"/>
      <stop offset="60%" stop-color="#10a37f"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10a37f" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#centerGlow)"/>

  <!-- Grid lines (subtle) -->
  <g opacity="0.06" stroke="#10a37f" stroke-width="0.5">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="100" y1="0" x2="100" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="500" y1="0" x2="500" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
    <line x1="700" y1="0" x2="700" y2="500"/>
  </g>

  <!-- Top accent glow line -->
  <rect x="0" y="0" width="800" height="1.5" fill="url(#glowLine)"/>

  <!-- Center glow blob -->
  <ellipse cx="200" cy="280" rx="200" ry="150" fill="#10a37f" opacity="0.04"/>
  <ellipse cx="600" cy="220" rx="180" ry="130" fill="#10a37f" opacity="0.05"/>

  <!-- Left Panel: OpenAI Logo + Branding -->
  <g transform="translate(60, 140)">
    <!-- OpenAI Swirl Logo (simplified) -->
    <g filter="url(#glow)">
      <circle cx="60" cy="60" r="50" fill="url(#gptGreen)" opacity="0.15"/>
      <circle cx="60" cy="60" r="42" fill="none" stroke="#10a37f" stroke-width="1.5" opacity="0.4"/>
      <!-- Simplified OpenAI-style swirl paths -->
      <path d="M60 18 C82 18, 102 38, 102 60 C102 82, 82 102, 60 102 C38 102, 18 82, 18 60" stroke="#10a37f" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M40 30 C55 22, 72 22, 84 32 C96 42, 98 58, 90 72" stroke="#10a37f" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.7"/>
      <path d="M30 48 C28 62, 34 76, 46 86 C58 96, 74 97, 86 90" stroke="#10a37f" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.5"/>
      <!-- Center dot -->
      <circle cx="60" cy="60" r="6" fill="#10a37f"/>
    </g>

    <!-- ChatGPT Plus Title -->
    <text x="130" y="48" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="32" font-weight="800" fill="white" letter-spacing="-1">ChatGPT</text>
    <text x="130" y="76" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#10a37f" letter-spacing="2">PLUS SUBSCRIPTION</text>

    <!-- Verified badge -->
    <rect x="130" y="90" width="130" height="22" rx="11" fill="#10a37f" opacity="0.15"/>
    <rect x="130" y="90" width="130" height="22" rx="11" fill="none" stroke="#10a37f" stroke-width="1" opacity="0.5"/>
    <text x="152" y="105" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="9.5" font-weight="700" fill="#10a37f" letter-spacing="1.5">✓ OFFICIAL ACCESS</text>

    <!-- Divider -->
    <line x1="0" y1="140" x2="340" y2="140" stroke="#10a37f" stroke-width="0.5" opacity="0.2"/>

    <!-- Key Features -->
    <text x="0" y="170" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#6b7280" letter-spacing="2">PREMIUM FEATURES</text>

    <g transform="translate(0, 185)">
      <circle cx="6" cy="6" r="3.5" fill="#10a37f"/>
      <text x="18" y="11" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="12" fill="#e5e7eb">GPT-4o &amp; GPT-4 Full Access</text>
    </g>
    <g transform="translate(0, 210)">
      <circle cx="6" cy="6" r="3.5" fill="#10a37f"/>
      <text x="18" y="11" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="12" fill="#e5e7eb">DALL·E 3 Image Generation</text>
    </g>
    <g transform="translate(0, 235)">
      <circle cx="6" cy="6" r="3.5" fill="#10a37f"/>
      <text x="18" y="11" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="12" fill="#e5e7eb">Advanced Code Interpreter</text>
    </g>
    <g transform="translate(0, 260)">
      <circle cx="6" cy="6" r="3.5" fill="#10a37f"/>
      <text x="18" y="11" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="12" fill="#e5e7eb">Plugins + Web Browsing</text>
    </g>
    <g transform="translate(0, 285)">
      <circle cx="6" cy="6" r="3.5" fill="#10a37f"/>
      <text x="18" y="11" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="12" fill="#e5e7eb">Custom GPTs Creation</text>
    </g>
  </g>

  <!-- Right Panel: Pricing Cards -->
  <g transform="translate(450, 60)">
    <!-- 1 Month Card -->
    <rect x="0" y="0" width="290" height="100" rx="16" fill="url(#cardGrad)"/>
    <rect x="0" y="0" width="290" height="100" rx="16" fill="none" stroke="#1e2d3a" stroke-width="1"/>
    <rect x="0" y="0" width="290" height="2" rx="1" fill="#10a37f" opacity="0.5"/>
    <text x="20" y="30" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#9ca3af">1 Month Plan</text>
    <text x="20" y="62" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="30" font-weight="800" fill="white">$9<tspan font-size="16" font-weight="600" fill="#6b7280">.99</tspan></text>
    <rect x="180" y="18" width="90" height="22" rx="11" fill="#10a37f" opacity="0.15"/>
    <rect x="180" y="18" width="90" height="22" rx="11" fill="none" stroke="#10a37f" stroke-width="1" opacity="0.4"/>
    <text x="192" y="33" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="9" font-weight="700" fill="#10a37f" letter-spacing="1">FLEXIBLE</text>
    <text x="20" y="85" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="11" fill="#6b7280">Full GPT-4o access · Monthly validity</text>

    <!-- 6 Month Card (Most Popular) -->
    <rect x="0" y="116" width="290" height="110" rx="16" fill="#0f1e1a"/>
    <rect x="0" y="116" width="290" height="110" rx="16" fill="none" stroke="#10a37f" stroke-width="1.5"/>
    <rect x="0" y="116" width="290" height="2" rx="1" fill="#10a37f"/>
    <!-- Popular badge -->
    <rect x="168" y="126" width="104" height="22" rx="11" fill="#10a37f"/>
    <text x="182" y="141" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="9" font-weight="800" fill="white" letter-spacing="1">MOST POPULAR</text>
    <text x="20" y="148" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#10a37f">6 Month Plan</text>
    <text x="20" y="182" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="30" font-weight="800" fill="white">$49<tspan font-size="16" font-weight="600" fill="#6b7280">.99</tspan></text>
    <text x="130" y="182" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="13" font-weight="500" fill="#4b5563" text-decoration="line-through">$59.94</text>
    <rect x="130" y="168" width="60" height="18" rx="9" fill="#10a37f" opacity="0.2"/>
    <text x="138" y="181" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="9" font-weight="700" fill="#10a37f">SAVE 17%</text>
    <text x="20" y="205" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="11" fill="#9ca3af">Priority access · Extended validity period</text>

    <!-- 1 Year Card -->
    <rect x="0" y="242" width="290" height="110" rx="16" fill="url(#cardGrad)"/>
    <rect x="0" y="242" width="290" height="110" rx="16" fill="none" stroke="#2a1f4e" stroke-width="1.5"/>
    <rect x="0" y="242" width="290" height="2" rx="1" fill="#8b5cf6" opacity="0.8"/>
    <rect x="176" y="252" width="96" height="22" rx="11" fill="#8b5cf6" opacity="0.2"/>
    <rect x="176" y="252" width="96" height="22" rx="11" fill="none" stroke="#8b5cf6" stroke-width="1" opacity="0.5"/>
    <text x="188" y="267" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="9" font-weight="700" fill="#a78bfa" letter-spacing="1">BEST VALUE</text>
    <text x="20" y="274" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#9ca3af">1 Year Plan</text>
    <text x="20" y="308" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="30" font-weight="800" fill="white">$89<tspan font-size="16" font-weight="600" fill="#6b7280">.99</tspan></text>
    <text x="132" y="308" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="13" font-weight="500" fill="#4b5563" text-decoration="line-through">$119.88</text>
    <rect x="132" y="294" width="60" height="18" rx="9" fill="#8b5cf6" opacity="0.2"/>
    <text x="140" y="307" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="9" font-weight="700" fill="#a78bfa">SAVE 25%</text>
    <text x="20" y="331" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="11" fill="#6b7280">Max savings · Annual guaranteed validity</text>

    <!-- Guarantee Badge -->
    <rect x="0" y="368" width="290" height="58" rx="14" fill="#081a14"/>
    <rect x="0" y="368" width="290" height="58" rx="14" fill="none" stroke="#10a37f" stroke-width="1" opacity="0.3"/>
    <text x="22" y="390" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#10a37f">🛡 100% Validity Guarantee</text>
    <text x="22" y="410" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="10" fill="#6b7280">Full replacement if access fails within plan period</text>
  </g>

  <!-- Bottom Brand Strip -->
  <rect x="0" y="456" width="800" height="44" fill="#0a0e1a"/>
  <line x1="0" y1="456" x2="800" y2="456" stroke="#10a37f" stroke-width="0.5" opacity="0.2"/>
  <text x="60" y="484" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="11" fill="#374151">Powered by OpenAI  ·  Instant Access Delivery  ·  Validity Guaranteed</text>
  <text x="560" y="484" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#10a37f">NEXUS Digital Store</text>
</svg>
