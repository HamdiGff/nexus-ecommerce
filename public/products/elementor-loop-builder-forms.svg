<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" preserveAspectRatio="xMidYMid slice" width="100%" height="100%">
  <defs>
    <linearGradient id="lfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08070d" />
      <stop offset="50%" stop-color="#140a17" />
      <stop offset="100%" stop-color="#06050a" />
    </linearGradient>

    <radialGradient id="lfGlow" cx="40%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#d30043" stop-opacity="0.25" />
      <stop offset="45%" stop-color="#ec4899" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <pattern id="lfGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#d30043" stroke-width="1" stroke-opacity="0.06" />
    </pattern>

    <filter id="shadowCardLf" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.75" />
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#lfBg)" />
  <rect width="1200" height="750" fill="url(#lfGrid)" />
  <rect width="1200" height="750" fill="url(#lfGlow)" />

  <!-- Top Badge Header -->
  <g transform="translate(60, 45)">
    <rect width="360" height="36" rx="18" fill="#1e0b17" fill-opacity="0.7" stroke="#ec4899" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="20" cy="18" r="5" fill="#f43f5e" />
    <text x="35" y="23" fill="#fbcfe8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1">DYNAMIC LOOP BUILDER &amp; PRO FORMS</text>
  </g>

  <!-- Title & Subtitle -->
  <g transform="translate(60, 115)">
    <text x="0" y="32" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.5">
      Loop Grid, Dynamic ACF Tags &amp; Lead Generation
    </text>
    <text x="0" y="62" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500">
      Build custom dynamic listings and capture high-converting leads without third-party form plugins.
    </text>
  </g>

  <!-- Left: Pro Multi-Step Form Builder Card -->
  <g transform="translate(60, 210)" filter="url(#shadowCardLf)">
    <rect width="640" height="470" rx="24" fill="#0e0814" fill-opacity="0.95" stroke="#2d1020" stroke-width="1.5" />
    
    <!-- Header -->
    <g transform="translate(24, 24)">
      <text x="0" y="18" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="800">
        Elementor Pro Multi-Step Form Engine
      </text>
      <text x="0" y="36" fill="#94a3b8" font-family="sans-serif" font-size="11">
        Direct integrations with Mailchimp, ActiveCampaign, Discord &amp; Webhooks
      </text>
    </g>

    <!-- Step Progress Indicator -->
    <g transform="translate(24, 76)">
      <rect width="180" height="8" rx="4" fill="#d30043" />
      <rect x="195" y="0" width="180" height="8" rx="4" fill="#d30043" />
      <rect x="390" y="0" width="180" height="8" rx="4" fill="#ffffff" fill-opacity="0.15" />
      <text x="0" y="24" fill="#fda4af" font-family="sans-serif" font-size="10.5" font-weight="700">Step 2: Project Specifications &amp; Budget</text>
    </g>

    <!-- Form Inputs Mockup -->
    <g transform="translate(24, 120)">
      <!-- Input 1 -->
      <g transform="translate(0, 0)">
        <text x="0" y="0" fill="#cbd5e1" font-family="sans-serif" font-size="11" font-weight="600">Company or Brand Name</text>
        <rect x="0" y="10" width="280" height="42" rx="10" fill="#1b0a19" stroke="#3d1428" stroke-width="1" />
        <text x="14" y="36" fill="#ffffff" font-family="sans-serif" font-size="12">Nexus Media Digital Agency</text>
      </g>

      <!-- Input 2 -->
      <g transform="translate(300, 0)">
        <text x="0" y="0" fill="#cbd5e1" font-family="sans-serif" font-size="11" font-weight="600">Work Email Address</text>
        <rect x="0" y="10" width="280" height="42" rx="10" fill="#1b0a19" stroke="#3d1428" stroke-width="1" />
        <text x="14" y="36" fill="#ffffff" font-family="sans-serif" font-size="12">director@nexusagency.com</text>
      </g>

      <!-- Dropdown Input -->
      <g transform="translate(0, 75)">
        <text x="0" y="0" fill="#cbd5e1" font-family="sans-serif" font-size="11" font-weight="600">Website Project Scope</text>
        <rect x="0" y="10" width="580" height="42" rx="10" fill="#1b0a19" stroke="#3d1428" stroke-width="1" />
        <text x="14" y="36" fill="#ffffff" font-family="sans-serif" font-size="12">Full WooCommerce Custom Redesign with Loop Grid</text>
      </g>

      <!-- Message Area -->
      <g transform="translate(0, 150)">
        <text x="0" y="0" fill="#cbd5e1" font-family="sans-serif" font-size="11" font-weight="600">Project Requirements</text>
        <rect x="0" y="10" width="580" height="70" rx="10" fill="#1b0a19" stroke="#3d1428" stroke-width="1" />
        <text x="14" y="34" fill="#94a3b8" font-family="sans-serif" font-size="11.5">Looking to eliminate 6 separate plugins by consolidating on Elementor Pro Theme Builder.</text>
      </g>

      <!-- Submit / Next Button -->
      <g transform="translate(0, 245)">
        <rect width="180" height="40" rx="10" fill="#d30043" />
        <text x="90" y="25" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">Continue to Step 3 &#8594;</text>
        
        <rect x="200" y="0" width="160" height="40" rx="10" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1" />
        <text x="280" y="25" fill="#cbd5e1" font-family="sans-serif" font-size="11.5" text-anchor="middle">Webhook Active ✓</text>
      </g>
    </g>
  </g>

  <!-- Right: Dynamic Loop Grid & ACF Integration Card -->
  <g transform="translate(730, 210)">
    <rect width="410" height="470" rx="24" fill="#0e0814" fill-opacity="0.95" stroke="#2d1020" stroke-width="1.5" />
    
    <g transform="translate(24, 24)">
      <text x="0" y="18" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="800">
        Loop Builder &amp; Dynamic Content
      </text>
      <text x="0" y="38" fill="#94a3b8" font-family="sans-serif" font-size="11.5">
        Custom post types &amp; Advanced Custom Fields (ACF)
      </text>
    </g>

    <!-- Dynamic Repeater Cards -->
    <g transform="translate(24, 75)">
      <!-- Loop Item 1 -->
      <g transform="translate(0, 0)">
        <rect width="362" height="78" rx="14" fill="#1b0918" stroke="#d30043" stroke-width="1" />
        <rect x="12" y="12" width="54" height="54" rx="8" fill="#d30043" fill-opacity="0.2" />
        <text x="39" y="44" fill="#ff4d79" font-family="sans-serif" font-size="18" text-anchor="middle">🏠</text>
        <text x="78" y="28" fill="#ffffff" font-family="sans-serif" font-size="12.5" font-weight="700">{acf_property_title}</text>
        <text x="78" y="46" fill="#10b981" font-family="monospace" font-size="11" font-weight="700">$845,000 • 4 Bed / 3 Bath</text>
        <text x="78" y="62" fill="#94a3b8" font-family="sans-serif" font-size="10">Location: {acf_property_city}</text>
      </g>

      <!-- Loop Item 2 -->
      <g transform="translate(0, 90)">
        <rect width="362" height="78" rx="14" fill="#1b0918" stroke="#3d1428" stroke-width="1" />
        <rect x="12" y="12" width="54" height="54" rx="8" fill="#a855f7" fill-opacity="0.2" />
        <text x="39" y="44" fill="#c084fc" font-family="sans-serif" font-size="18" text-anchor="middle">🚗</text>
        <text x="78" y="28" fill="#ffffff" font-family="sans-serif" font-size="12.5" font-weight="700">{acf_vehicle_model}</text>
        <text x="78" y="46" fill="#10b981" font-family="monospace" font-size="11" font-weight="700">$62,400 • Electric AWD</text>
        <text x="78" y="62" fill="#94a3b8" font-family="sans-serif" font-size="10">Range: 340 Miles • 0-60 in 3.6s</text>
      </g>

      <!-- Loop Item 3 -->
      <g transform="translate(0, 180)">
        <rect width="362" height="78" rx="14" fill="#1b0918" stroke="#3d1428" stroke-width="1" />
        <rect x="12" y="12" width="54" height="54" rx="8" fill="#3b82f6" fill-opacity="0.2" />
        <text x="39" y="44" fill="#60a5fa" font-family="sans-serif" font-size="18" text-anchor="middle">🎓</text>
        <text x="78" y="28" fill="#ffffff" font-family="sans-serif" font-size="12.5" font-weight="700">{acf_course_name}</text>
        <text x="78" y="46" fill="#10b981" font-family="monospace" font-size="11" font-weight="700">$149 • 24 Modules</text>
        <text x="78" y="62" fill="#94a3b8" font-family="sans-serif" font-size="10">Instructor: {acf_instructor}</text>
      </g>

      <!-- Bottom Tag Pill -->
      <g transform="translate(0, 275)">
        <rect width="362" height="42" rx="10" fill="#d30043" fill-opacity="0.15" stroke="#d30043" stroke-opacity="0.3" />
        <circle cx="20" cy="21" r="5" fill="#ff3366" />
        <text x="34" y="25" fill="#fbcfe8" font-family="sans-serif" font-size="11" font-weight="700">Supports ACF, Pods, MetaBox &amp; Toolset</text>
      </g>
    </g>
  </g>
</svg>
