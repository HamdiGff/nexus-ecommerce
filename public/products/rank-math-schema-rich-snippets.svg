      <!-- Star Rating & Review Rich Snippet Line -->
      <g transform="translate(20, 84)">
        <!-- Stars -->
        <g fill="#f59e0b">
          <polygon points="8,1 10,6 15,6 11,9 13,14 8,11 3,14 5,9 1,6 6,6" />
          <polygon points="26,1 28,6 33,6 29,9 31,14 26,11 21,14 23,9 19,6 24,6" />
          <polygon points="44,1 46,6 51,6 47,9 49,14 44,11 39,14 41,9 37,6 42,6" />
          <polygon points="62,1 64,6 69,6 65,9 67,14 62,11 57,14 59,9 55,6 60,6" />
          <polygon points="80,1 82,6 87,6 83,9 85,14 80,11 75,14 77,9 73,6 78,6" />
        </g>
        <text x="96" y="11" fill="#facc15" font-family="sans-serif" font-size="12" font-weight="800">4.9</text>
        <text x="120" y="11" fill="#94a3b8" font-family="sans-serif" font-size="11.5">(1,248 reviews) • $179.99 • In stock</text>

        <!-- Rank Math Pro Badge -->
        <rect x="420" y="-8" width="128" height="24" rx="12" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.4" />
        <text x="484" y="8" fill="#34d399" font-family="sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">+285% CTR BOOST</text>
      </g>

      <!-- Snippet Description -->
      <text x="20" y="125" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" leading-tight="true">
