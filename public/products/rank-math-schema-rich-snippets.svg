      <g transform="translate(0, 248)">
        <rect width="348" height="52" rx="12" fill="#1e293b" fill-opacity="0.7" stroke="#ec4899" stroke-opacity="0.3" />
        <circle cx="26" cy="26" r="14" fill="#ec4899" fill-opacity="0.2" />
        <text x="26" y="30" fill="#f472b6" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">📚</text>
        <text x="52" y="25" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="700">Custom &amp; Advanced Types</text>
        <text x="52" y="41" fill="#94a3b8" font-family="sans-serif" font-size="11">Article, Recipe, Course, Software, Event</text>
      </g>

      <!-- Bottom Status Pill -->
      <g transform="translate(0, 316)">
        <rect width="348" height="42" rx="10" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-opacity="0.3" />
        <circle cx="24" cy="21" r="5" fill="#10b981" />
        <text x="38" y="25" fill="#6ee7b7" font-family="sans-serif" font-size="11" font-weight="700">100% Google Structured Data Test Pass</text>
