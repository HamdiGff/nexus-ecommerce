<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" preserveAspectRatio="xMidYMid slice" width="100%" height="100%">
  <defs>
    <linearGradient id="snipBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b14" />
      <stop offset="50%" stop-color="#0e1526" />
      <stop offset="100%" stop-color="#060910" />
    </linearGradient>

    <radialGradient id="snipGlow" cx="60%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25" />
      <stop offset="40%" stop-color="#8b5cf6" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <pattern id="snipGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.06" />
    </pattern>

    <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#3b82f6" flood-opacity="0.4" />
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000000" flood-opacity="0.7" />
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#snipBg)" />
  <rect width="1200" height="750" fill="url(#snipGrid)" />
  <rect width="1200" height="750" fill="url(#snipGlow)" />

  <!-- Top Badge Header -->
  <g transform="translate(60, 45)">
    <rect width="330" height="36" rx="18" fill="#1e293b" fill-opacity="0.6" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="1" />
    <circle cx="20" cy="18" r="5" fill="#38bdf8" />
    <text x="35" y="23" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1">RANK MATH PRO • SCHEMA LAB</text>
  </g>

  <!-- Title & Subtitle -->
  <g transform="translate(60, 115)">
    <text x="0" y="32" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.5">
      Advanced Schema Markup &amp; Google Rich Snippets
    </text>
    <text x="0" y="62" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500">
      Visual representation of JSON-LD Schema structures validated directly in Google Search Results.
    </text>
  </g>

  <!-- Left Column: Google SERP Preview Card -->
  <g transform="translate(60, 210)" filter="url(#cardShadow)">
    <rect width="640" height="470" rx="24" fill="#0f172a" fill-opacity="0.95" stroke="#334155" stroke-width="1.5" />
    
    <!-- Google Search Bar Mock -->
    <g transform="translate(24, 24)">
      <rect width="592" height="42" rx="21" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <circle cx="26" cy="21" r="7" fill="none" stroke="#94a3b8" stroke-width="2" />
      <line x1="31" y1="26" x2="38" y2="33" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
      <text x="48" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">
        best mechanical wireless gaming keyboard 2026
      </text>
    </g>

    <!-- Google Search Result 1: Standard (Boring / No Rich Snippet) -->
    <g transform="translate(28, 90)">
      <rect width="584" height="100" rx="14" fill="#0b1120" stroke="#1e293b" stroke-width="1" />
      <text x="18" y="24" fill="#64748b" font-family="monospace" font-size="11">https://standard-competitor.com &gt; reviews</text>
      <text x="18" y="46" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">
