      </text>

      <!-- FAQ Nested Rich Snippets (Rank Math PRO Exclusive) -->
      <g transform="translate(20, 150)">
        <rect width="544" height="68" rx="10" fill="#080e1c" stroke="#1e293b" stroke-width="1" />
        <g transform="translate(14, 20)">
