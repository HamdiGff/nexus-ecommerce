          <text x="16" y="4" fill="#38bdf8" font-family="sans-serif" font-size="11.5" font-weight="600">Q: Is the switch actuation point adjustable?</text>
          <text x="16" y="18" fill="#94a3b8" font-family="sans-serif" font-size="10.5">Yes, configure between 0.2mm to 3.8mm in 0.1mm increments.</text>
        </g>
