      <!-- Headline Title with Boost Tag -->
      <text x="20" y="62" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800">
        Apex Pro Wireless Mechanical Keyboard [Full In-Depth Benchmark]
