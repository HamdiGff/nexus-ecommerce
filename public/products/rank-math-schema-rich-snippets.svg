      <!-- Item 2: FAQ & HowTo -->
      <g transform="translate(0, 62)">
        <rect width="348" height="52" rx="12" fill="#1e293b" fill-opacity="0.7" stroke="#8b5cf6" stroke-opacity="0.3" />
        <circle cx="26" cy="26" r="14" fill="#8b5cf6" fill-opacity="0.2" />
        <text x="26" y="30" fill="#a78bfa" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">❓</text>
        <text x="52" y="25" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="700">FAQ &amp; How-To Accordion</text>
        <text x="52" y="41" fill="#94a3b8" font-family="sans-serif" font-size="11">Increases Google SERP vertical space by 65%</text>
      </g>

      <!-- Item 3: Local Business & Maps -->
      <g transform="translate(0, 124)">
        <rect width="348" height="52" rx="12" fill="#1e293b" fill-opacity="0.7" stroke="#10b981" stroke-opacity="0.3" />
        <circle cx="26" cy="26" r="14" fill="#10b981" fill-opacity="0.2" />
        <text x="26" y="30" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">📍</text>
        <text x="52" y="25" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="700">Local SEO &amp; Multi-Location</text>
        <text x="52" y="41" fill="#94a3b8" font-family="sans-serif" font-size="11">Address, Phone, Operating Hours, Geo Map</text>
      </g>

      <!-- Item 4: Video & Podcast -->
      <g transform="translate(0, 186)">
        <rect width="348" height="52" rx="12" fill="#1e293b" fill-opacity="0.7" stroke="#f59e0b" stroke-opacity="0.3" />
        <circle cx="26" cy="26" r="14" fill="#f59e0b" fill-opacity="0.2" />
        <text x="26" y="30" fill="#fbbf24" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">🎬</text>
        <text x="52" y="25" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="700">Video &amp; Podcast Schema</text>
        <text x="52" y="41" fill="#94a3b8" font-family="sans-serif" font-size="11">YouTube thumbnail preview + timestamps</text>
