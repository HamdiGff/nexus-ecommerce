      <!-- CTR Badge -->
      <rect x="475" y="14" width="90" height="22" rx="11" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-opacity="0.3" />
      <text x="520" y="29" fill="#f87171" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">1.8% CTR (Avg)</text>
    </g>

    <!-- Google Search Result 2: Powered by Rank Math PRO (Eye-Catching Rich Snippet) -->
    <g transform="translate(28, 205)" filter="url(#glowBlue)">
      <rect width="584" height="240" rx="18" fill="#0c162d" stroke="#3b82f6" stroke-width="2" />
      
