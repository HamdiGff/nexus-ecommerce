        <text x="26" y="30" fill="#60a5fa" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">🛍️</text>
        <text x="52" y="25" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="700">Product &amp; Review Schema</text>
        <text x="52" y="41" fill="#94a3b8" font-family="sans-serif" font-size="11">Price, Stock, Aggregate Star Rating</text>
