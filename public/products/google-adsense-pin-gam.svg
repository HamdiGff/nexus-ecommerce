<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1322"/>
      <stop offset="100%" stop-color="#080b14"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34A853"/>
      <stop offset="100%" stop-color="#1B8039"/>
    </linearGradient>
    <linearGradient id="envelopeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8eaed"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="20" fill="url(#bg2)"/>
  <rect x="2" y="2" width="796" height="496" rx="18" fill="none" stroke="#4285F4" stroke-opacity="0.2" stroke-width="2"/>

  <!-- Left Side: PIN Verification Postal Envelope Simulation -->
  <g transform="translate(60, 70)">
    <!-- Glow -->
    <circle cx="150" cy="170" r="130" fill="#FBBC05" opacity="0.12"/>
    
    <!-- Envelope Base -->
    <rect x="20" y="40" width="280" height="180" rx="12" fill="url(#envelopeGrad)" stroke="#bdc1c6" stroke-width="2" filter="drop-shadow(0 15px 25px rgba(0,0,0,0.5))"/>
    
    <!-- Envelope Flap & Header -->
    <path d="M 20 40 L 160 140 L 300 40" fill="none" stroke="#dadce0" stroke-width="2"/>
    <rect x="35" y="55" width="70" height="16" rx="3" fill="#EA4335" fill-opacity="0.15"/>
    <text x="40" y="67" fill="#EA4335" font-family="system-ui, sans-serif" font-weight="800" font-size="9">PRIORITY POST</text>
    <text x="35" y="95" fill="#202124" font-family="system-ui, sans-serif" font-weight="800" font-size="14">Google AdSense™</text>
    <text x="35" y="112" fill="#5f6368" font-family="system-ui, sans-serif" font-weight="600" font-size="10">Personal Identification Number (PIN)</text>

    <!-- 6-Digit PIN Code Cutout -->
    <g transform="translate(35, 130)">
      <rect x="0" y="0" width="245" height="42" rx="6" fill="#f1f3f4" stroke="#4285F4" stroke-width="1.5"/>
      <text x="12" y="26" fill="#1a73e8" font-family="monospace" font-weight="900" font-size="20" letter-spacing="8">7 4 9 2 0 1</text>
      <rect x="180" y="8" width="55" height="26" rx="4" fill="#34A853"/>
      <text x="187" y="25" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="800" font-size="10">PASSED</text>
    </g>

    <!-- Address Verified Stamp -->
    <g transform="translate(160, 185) rotate(-10)">
      <rect x="0" y="0" width="140" height="36" rx="8" fill="#1e4620" stroke="#34A853" stroke-width="2"/>
      <text x="12" y="23" fill="#81C995" font-family="system-ui, sans-serif" font-weight="900" font-size="12">✓ PIN VERIFIED</text>
    </g>
    <text x="40" y="255" fill="#E8EAED" font-family="system-ui, sans-serif" font-weight="700" font-size="13">Zero Postal Waiting Period</text>
    <text x="40" y="275" fill="#9AA0A6" font-family="system-ui, sans-serif" font-size="11">Address &amp; Tax ID pre-authenticated for immediate withdrawals.</text>
  </g>

  <!-- Right Side: Google Ad Manager & 5x Payments Badge -->
  <g transform="translate(420, 60)">
    <!-- GAM 360 Card -->
    <rect x="0" y="0" width="320" height="160" rx="16" fill="#13192c" stroke="#4285F4" stroke-opacity="0.3" stroke-width="1.5"/>
    <g transform="translate(20, 24)">
      <circle cx="16" cy="16" r="16" fill="#4285F4"/>
      <text x="9" y="23" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="18">M</text>
      <text x="42" y="15" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="800" font-size="14">Google Ad Manager (GAM)</text>
      <text x="42" y="32" fill="#8AB4F8" font-family="system-ui, sans-serif" font-weight="600" font-size="11">Multiple Customer Management (MCM)</text>
      
      <line x1="0" y1="46" x2="280" y2="46" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="0" y="68" fill="#E8EAED" font-family="system-ui, sans-serif" font-weight="600" font-size="11">Open Bidding &amp; Prebid.js Integration</text>
      <text x="0" y="86" fill="#9AA0A6" font-family="system-ui, sans-serif" font-size="10.5">Higher eCPMs via programmatic header bidding.</text>
      <text x="0" y="104" fill="#34A853" font-family="system-ui, sans-serif" font-weight="700" font-size="11">✓ Enterprise Ad Exchange Ready</text>
    </g>

    <!-- 5+ Times Paid Veteran Card -->
    <g transform="translate(0, 180)">
      <rect x="0" y="0" width="320" height="180" rx="16" fill="#151d18" stroke="#34A853" stroke-opacity="0.35" stroke-width="1.5"/>
      <g transform="translate(20, 24)">
        <circle cx="16" cy="16" r="16" fill="#34A853"/>
        <text x="11" y="23" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="16">$</text>
        <text x="42" y="15" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="800" font-size="14">5+ Times Paid History</text>
        <text x="42" y="32" fill="#81C995" font-family="system-ui, sans-serif" font-weight="600" font-size="11">Verified Google Bank Wire Receipts</text>
        
        <line x1="0" y1="46" x2="280" y2="46" stroke="#ffffff" stroke-opacity="0.1"/>
        
        <!-- Payout receipts tick -->
        <g transform="translate(0, 58)">
          <text x="0" y="12" fill="#E8EAED" font-family="system-ui, sans-serif" font-weight="600" font-size="11">Automatic Payout Thresholds Cleared</text>
          <text x="0" y="30" fill="#9AA0A6" font-family="system-ui, sans-serif" font-size="10.5">Immune to new account initial scrutiny flags.</text>
          <text x="0" y="52" fill="#FBBC05" font-family="system-ui, sans-serif" font-weight="700" font-size="11">★ Maximum Algorithm Trust Score</text>
          <text x="0" y="72" fill="#9AA0A6" font-family="system-ui, sans-serif" font-size="10">Works with USA, UK, Canada, India, Middle East banks</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Bottom Geo Flags Strip -->
  <g transform="translate(60, 420)">
    <rect x="0" y="0" width="680" height="50" rx="12" fill="#111624" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="20" y="30" fill="#9AA0A6" font-family="system-ui, sans-serif" font-weight="700" font-size="11">SUPPORTED REGIONS:</text>
    <text x="160" y="30" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="800" font-size="12">🇺🇸 USA</text>
    <text x="240" y="30" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="800" font-size="12">🇬🇧 United Kingdom</text>
    <text x="380" y="30" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="800" font-size="12">🇨🇦 Canada</text>
    <text x="470" y="30" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="800" font-size="12">🇮🇳 India</text>
    <text x="550" y="30" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="800" font-size="12">🇹🇷 Turkey</text>
    <text x="630" y="30" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="800" font-size="12">🇦🇪 GCC</text>
  </g>
</svg>
