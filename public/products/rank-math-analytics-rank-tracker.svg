<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" preserveAspectRatio="xMidYMid slice" width="100%" height="100%">
  <defs>
    <linearGradient id="anBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b14" />
      <stop offset="50%" stop-color="#0d1424" />
      <stop offset="100%" stop-color="#05080e" />
    </linearGradient>

    <radialGradient id="anGlow" cx="40%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.22" />
      <stop offset="45%" stop-color="#3b82f6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.0" />
    </linearGradient>

    <pattern id="anGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.06" />
    </pattern>

    <filter id="shadowCard" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.7" />
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#anBg)" />
  <rect width="1200" height="750" fill="url(#anGrid)" />
  <rect width="1200" height="750" fill="url(#anGlow)" />

  <!-- Top Badge Header -->
  <g transform="translate(60, 45)">
    <rect width="360" height="36" rx="18" fill="#1e293b" fill-opacity="0.6" stroke="#10b981" stroke-opacity="0.3" stroke-width="1" />
    <circle cx="20" cy="18" r="5" fill="#10b981" />
    <text x="35" y="23" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1">GOOGLE SEARCH CONSOLE &amp; GA4 SYNC</text>
  </g>

  <!-- Title & Subtitle -->
  <g transform="translate(60, 115)">
    <text x="0" y="32" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.5">
      Automated Keyword Rank Tracker &amp; Live Analytics
    </text>
    <text x="0" y="62" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500">
      Track keyword positions directly within your WordPress Dashboard with Google Search Console integration.
    </text>
  </g>

  <!-- Left: Analytics Performance Dashboard Card -->
  <g transform="translate(60, 210)" filter="url(#shadowCard)">
    <rect width="660" height="470" rx="24" fill="#0f172a" fill-opacity="0.95" stroke="#334155" stroke-width="1.5" />
    
    <!-- KPI Counters Grid -->
    <g transform="translate(24, 24)">
      <!-- KPI 1: Total Clicks -->
      <g transform="translate(0, 0)">
        <rect width="142" height="74" rx="12" fill="#1e293b" fill-opacity="0.6" stroke="#475569" stroke-width="1" />
        <text x="14" y="22" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">Total Clicks</text>
        <text x="14" y="48" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="900">48.2K</text>
        <text x="14" y="64" fill="#10b981" font-family="sans-serif" font-size="10.5" font-weight="700">▲ +38.4% vs last mo</text>
      </g>

      <!-- KPI 2: Total Impressions -->
      <g transform="translate(156, 0)">
        <rect width="142" height="74" rx="12" fill="#1e293b" fill-opacity="0.6" stroke="#475569" stroke-width="1" />
        <text x="14" y="22" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">Impressions</text>
        <text x="14" y="48" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="900">894K</text>
        <text x="14" y="64" fill="#10b981" font-family="sans-serif" font-size="10.5" font-weight="700">▲ +122K organic</text>
      </g>

      <!-- KPI 3: Average CTR -->
      <g transform="translate(312, 0)">
        <rect width="142" height="74" rx="12" fill="#1e293b" fill-opacity="0.6" stroke="#475569" stroke-width="1" />
        <text x="14" y="22" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">Average CTR</text>
        <text x="14" y="48" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="900">5.4%</text>
        <text x="14" y="64" fill="#38bdf8" font-family="sans-serif" font-size="10.5" font-weight="700">Rich Snippets Active</text>
      </g>

      <!-- KPI 4: Avg Position -->
      <g transform="translate(468, 0)">
        <rect width="142" height="74" rx="12" fill="#1e293b" fill-opacity="0.6" stroke="#475569" stroke-width="1" />
        <text x="14" y="22" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">Avg Position</text>
        <text x="14" y="48" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="900">3.8</text>
        <text x="14" y="64" fill="#10b981" font-family="sans-serif" font-size="10.5" font-weight="700">▲ +14 pos higher</text>
      </g>
    </g>

    <!-- Main Trend Graph Area -->
    <g transform="translate(24, 120)">
      <rect width="612" height="310" rx="16" fill="#0b1120" stroke="#1e293b" stroke-width="1" />
      
      <!-- Graph Header -->
      <g transform="translate(20, 24)">
        <text x="0" y="0" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="700">
          Google Search Console 30-Day Growth Trend
        </text>
        <circle cx="480" cy="-4" r="4" fill="#3b82f6" />
        <text x="492" y="0" fill="#94a3b8" font-family="sans-serif" font-size="11">Clicks</text>
        <circle cx="540" cy="-4" r="4" fill="#10b981" />
        <text x="552" y="0" fill="#94a3b8" font-family="sans-serif" font-size="11">Rank Gain</text>
      </g>

      <!-- Chart Grid Lines -->
      <g stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4" transform="translate(20, 60)">
        <line x1="0" y1="40" x2="572" y2="40" />
        <line x1="0" y1="100" x2="572" y2="100" />
        <line x1="0" y1="160" x2="572" y2="160" />
        <line x1="0" y1="220" x2="572" y2="220" />
      </g>

      <!-- Fill area under curve -->
      <path d="M 20 250 L 20 220 C 80 210, 140 180, 200 170 C 260 160, 320 130, 380 110 C 440 90, 500 70, 592 50 L 592 270 L 20 270 Z" fill="url(#chartGrad)" />

      <!-- Curve Line (Clicks Growth) -->
      <path d="M 20 220 C 80 210, 140 180, 200 170 C 260 160, 320 130, 380 110 C 440 90, 500 70, 592 50" fill="none" stroke="#3b82f6" stroke-width="3.5" stroke-linecap="round" />

      <!-- Highlight Data Point -->
      <g transform="translate(592, 50)">
        <circle cx="0" cy="0" r="7" fill="#3b82f6" stroke="#ffffff" stroke-width="2" />
        <rect x="-80" y="-36" width="75" height="26" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1" />
        <text x="-42" y="-19" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">2,410 /day</text>
      </g>

      <!-- Date Labels -->
      <g fill="#64748b" font-family="sans-serif" font-size="10" transform="translate(20, 290)">
        <text x="0" y="0">Day 1</text>
        <text x="140" y="0">Day 8</text>
        <text x="280" y="0">Day 15</text>
        <text x="420" y="0">Day 22</text>
        <text x="545" y="0">Day 30</text>
      </g>
    </g>
  </g>

  <!-- Right: Rank Tracker Keyword Positioning Table -->
  <g transform="translate(750, 210)">
    <rect width="390" height="470" rx="24" fill="#0f172a" fill-opacity="0.95" stroke="#334155" stroke-width="1.5" />
    
    <g transform="translate(24, 24)">
      <text x="0" y="20" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="800">
        Rank Tracker Live Table
      </text>
      <text x="0" y="40" fill="#94a3b8" font-family="sans-serif" font-size="12">
        Tracking 500 target keywords with SERP history:
      </text>
    </g>

    <!-- Table Rows -->
    <g transform="translate(24, 85)">
      <!-- Row 1 -->
      <g transform="translate(0, 0)">
        <rect width="342" height="64" rx="12" fill="#1e293b" fill-opacity="0.7" stroke="#3b82f6" stroke-opacity="0.3" />
        <text x="16" y="26" fill="#f8fafc" font-family="sans-serif" font-size="12.5" font-weight="700">best wireless keyboard 2026</text>
        <text x="16" y="44" fill="#94a3b8" font-family="sans-serif" font-size="11">Vol: 18.2K • KD: 32</text>
        <!-- Rank Pill -->
        <rect x="250" y="14" width="76" height="36" rx="8" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.4" />
        <text x="288" y="32" fill="#34d399" font-family="sans-serif" font-size="14" font-weight="900" text-anchor="middle">#1 <tspan font-size="10">▲ +8</tspan></text>
      </g>

      <!-- Row 2 -->
      <g transform="translate(0, 74)">
        <rect width="342" height="64" rx="12" fill="#1e293b" fill-opacity="0.7" stroke="#10b981" stroke-opacity="0.3" />
        <text x="16" y="26" fill="#f8fafc" font-family="sans-serif" font-size="12.5" font-weight="700">wordpress seo schema generator</text>
        <text x="16" y="44" fill="#94a3b8" font-family="sans-serif" font-size="11">Vol: 9.4K • KD: 24</text>
        <rect x="250" y="14" width="76" height="36" rx="8" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.4" />
        <text x="288" y="32" fill="#34d399" font-family="sans-serif" font-size="14" font-weight="900" text-anchor="middle">#2 <tspan font-size="10">▲ +14</tspan></text>
      </g>

      <!-- Row 3 -->
      <g transform="translate(0, 148)">
        <rect width="342" height="64" rx="12" fill="#1e293b" fill-opacity="0.7" stroke="#8b5cf6" stroke-opacity="0.3" />
        <text x="16" y="26" fill="#f8fafc" font-family="sans-serif" font-size="12.5" font-weight="700">how to pass core web vitals</text>
        <text x="16" y="44" fill="#94a3b8" font-family="sans-serif" font-size="11">Vol: 14.1K • KD: 41</text>
        <rect x="250" y="14" width="76" height="36" rx="8" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.4" />
        <text x="288" y="32" fill="#34d399" font-family="sans-serif" font-size="14" font-weight="900" text-anchor="middle">#3 <tspan font-size="10">▲ +19</tspan></text>
      </g>

      <!-- Row 4 -->
      <g transform="translate(0, 222)">
        <rect width="342" height="64" rx="12" fill="#1e293b" fill-opacity="0.7" stroke="#f59e0b" stroke-opacity="0.3" />
        <text x="16" y="26" fill="#f8fafc" font-family="sans-serif" font-size="12.5" font-weight="700">rank math pro official license</text>
        <text x="16" y="44" fill="#94a3b8" font-family="sans-serif" font-size="11">Vol: 6.8K • KD: 18</text>
        <rect x="250" y="14" width="76" height="36" rx="8" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.4" />
        <text x="288" y="32" fill="#34d399" font-family="sans-serif" font-size="14" font-weight="900" text-anchor="middle">#1 <tspan font-size="10">▲ +4</tspan></text>
      </g>

      <!-- Bottom Status Pill -->
      <g transform="translate(0, 305)">
        <rect width="342" height="42" rx="10" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-opacity="0.3" />
        <circle cx="20" cy="21" r="5" fill="#38bdf8" />
        <text x="34" y="25" fill="#93c5fd" font-family="sans-serif" font-size="11" font-weight="700">Automated Daily Position Sync &amp; Email Alerts</text>
      </g>
    </g>
  </g>
</svg>
