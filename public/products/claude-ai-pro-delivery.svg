<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="bgClaudeD" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0c0910"/>
      <stop offset="50%" stop-color="#140d12"/>
      <stop offset="100%" stop-color="#1a0e10"/>
    </linearGradient>
    <linearGradient id="glowLineClaudeD" x1="0" y1="0" x2="800" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bgClaudeD)"/>
  <rect x="0" y="0" width="800" height="1.5" fill="url(#glowLineClaudeD)"/>

  <!-- Title -->
  <text x="50" y="55" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="11" font-weight="800" fill="#f97316" letter-spacing="3">15–30 MINUTE ACTIVATION PIPELINE</text>
  <text x="50" y="95" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="32" font-weight="900" fill="white" letter-spacing="-1">How Delivery Works: Pro vs. Team</text>
  <text x="50" y="122" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="14" fill="#94a3b8">Submit your personal email at checkout. Everything else is completed within 30 minutes.</text>

  <!-- Flow 1: Claude Team Path -->
  <g transform="translate(50, 150)">
    <rect width="700" height="125" rx="18" fill="#170f1a"/>
    <rect width="700" height="125" rx="18" fill="none" stroke="#fbbf24" stroke-width="1.2" opacity="0.6"/>

    <rect x="20" y="20" width="90" height="22" rx="11" fill="#fbbf24"/>
    <text x="31" y="35" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="9.5" font-weight="900" fill="#170f1a">TEAM PLAN</text>
    <text x="120" y="35" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="14" font-weight="800" fill="#fde68a">Official Anthropic Email Invitation (Zero 2FA Needed)</text>

    <!-- 3 Step Horizontal Pipeline -->
    <g transform="translate(20, 56)">
      <text x="0" y="18" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="11" font-weight="800" fill="#fbbf24">Step 1: Order with Email</text>
      <text x="0" y="36" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="10.5" fill="#94a3b8">Provide your personal Claude email at checkout.</text>

      <text x="230" y="18" font-family="sans-serif" font-size="18" fill="#fbbf24" opacity="0.6">→</text>

      <text x="260" y="18" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="11" font-weight="800" fill="#fbbf24">Step 2: Check Your Inbox</text>
      <text x="260" y="36" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="10.5" fill="#94a3b8">Receive official Anthropic Team invite link (15–30 mins).</text>

      <text x="500" y="18" font-family="sans-serif" font-size="18" fill="#fbbf24" opacity="0.6">→</text>

      <text x="530" y="18" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="11" font-weight="800" fill="#fbbf24">Step 3: Click &amp; Activate</text>
      <text x="530" y="36" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="10.5" fill="#94a3b8">Accept invite to instantly unlock 5x Claude 3.5 Sonnet limits.</text>
    </g>
  </g>

  <!-- Flow 2: Claude Pro Path -->
  <g transform="translate(50, 295)">
    <rect width="700" height="135" rx="18" fill="#140f16"/>
    <rect width="700" height="135" rx="18" fill="none" stroke="#f97316" stroke-width="1.2" opacity="0.6"/>

    <rect x="20" y="20" width="86" height="22" rx="11" fill="#f97316"/>
    <text x="32" y="35" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="9.5" font-weight="900" fill="white">PRO PLAN</text>
    <text x="116" y="35" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="14" font-weight="800" fill="#fb923c">Manual 2FA Login Upgrade on Customer Email</text>

    <!-- 3 Step Horizontal Pipeline -->
    <g transform="translate(20, 56)">
      <text x="0" y="18" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="11" font-weight="800" fill="#f97316">Step 1: Submit Only Email</text>
      <text x="0" y="36" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="10.5" fill="#94a3b8">Enter your personal Claude email address at checkout.</text>
      <text x="0" y="52" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="10" fill="#64748b">No password required during checkout.</text>

      <text x="230" y="24" font-family="sans-serif" font-size="18" fill="#f97316" opacity="0.6">→</text>

      <text x="260" y="18" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="11" font-weight="800" fill="#f97316">Step 2: Live Chat / Ticket 2FA</text>
      <text x="260" y="36" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="10.5" fill="#94a3b8">Our engineer connects via Live Chat / Ticket</text>
      <text x="260" y="52" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="10" fill="#64748b">to request the one-time 2FA login verification code.</text>

      <text x="500" y="24" font-family="sans-serif" font-size="18" fill="#f97316" opacity="0.6">→</text>

      <text x="530" y="18" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="11" font-weight="800" fill="#f97316">Step 3: Pro Activated</text>
      <text x="530" y="36" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="10.5" fill="#94a3b8">Your personal account is upgraded</text>
      <text x="530" y="52" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="10" fill="#ea580c">100% validity guarantee applied for full duration.</text>
    </g>
  </g>

  <!-- Bottom Strip -->
  <rect x="0" y="460" width="800" height="40" fill="#07050a"/>
  <text x="50" y="484" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="11" fill="#64748b">Average Delivery SLA: 18 Minutes  •  Active Order Live Chat Desk Available 24/7  •  Full Replacement Guarantee</text>
  <text x="660" y="484" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="11" font-weight="800" fill="#f97316">NEXUS VAULT</text>
</svg>