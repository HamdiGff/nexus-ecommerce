      <stop offset="50%" stop-color="#34A853" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FABB05" stop-opacity="0.25"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
