<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="bgD" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070c14"/>
      <stop offset="100%" stop-color="#050e12"/>
    </linearGradient>
    <linearGradient id="glowLineD" x1="0" y1="0" x2="800" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bgD)"/>
  <rect x="0" y="0" width="800" height="1.5" fill="url(#glowLineD)"/>

  <!-- Title -->
  <text x="50" y="55" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="11" font-weight="800" fill="#38bdf8" letter-spacing="3">15–30 MINUTE ACTIVATION PIPELINE</text>
  <text x="50" y="95" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="32" font-weight="900" fill="white" letter-spacing="-1">How Delivery Works: Plus vs. Pro</text>
  <text x="50" y="122" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="14" fill="#64748b">Submit your personal email at checkout. Everything else is completed within 30 minutes.</text>

  <!-- Flow 1: ChatGPT Pro Path -->
  <g transform="translate(50, 150)">
    <rect width="700" height="125" rx="18" fill="#0f0d1f"/>
    <rect width="700" height="125" rx="18" fill="none" stroke="#8b5cf6" stroke-width="1.2" opacity="0.6"/>

    <rect x="20" y="20" width="86" height="22" rx="11" fill="#8b5cf6"/>
    <text x="32" y="35" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="9.5" font-weight="900" fill="white">PRO PLAN</text>
    <text x="116" y="35" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="14" font-weight="800" fill="#c084fc">Official OpenAI Email Invitation (Zero 2FA Needed)</text>

    <!-- 3 Step Horizontal Pipeline -->
    <g transform="translate(20, 56)">
      <text x="0" y="18" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="11" font-weight="800" fill="#a78bfa">Step 1: Order with Email</text>
      <text x="0" y="36" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="10.5" fill="#94a3b8">Provide your personal ChatGPT email at checkout.</text>

      <text x="230" y="18" font-family="sans-serif" font-size="18" fill="#8b5cf6" opacity="0.6">→</text>

      <text x="260" y="18" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="11" font-weight="800" fill="#a78bfa">Step 2: Check Your Inbox</text>
      <text x="260" y="36" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="10.5" fill="#94a3b8">Receive official OpenAI Team/Pro invite link (15–30 mins).</text>

      <text x="500" y="18" font-family="sans-serif" font-size="18" fill="#8b5cf6" opacity="0.6">→</text>

      <text x="530" y="18" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="11" font-weight="800" fill="#a78bfa">Step 3: Click &amp; Activate</text>
      <text x="530" y="36" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="10.5" fill="#94a3b8">Accept invite to instantly unlock o1 Pro &amp; unlimited GPT-4o.</text>
    </g>
  </g>

  <!-- Flow 2: ChatGPT Plus Path -->
  <g transform="translate(50, 295)">
    <rect width="700" height="135" rx="18" fill="#081414"/>
    <rect width="700" height="135" rx="18" fill="none" stroke="#10a37f" stroke-width="1.2" opacity="0.6"/>

    <rect x="20" y="20" width="90" height="22" rx="11" fill="#10a37f"/>
    <text x="32" y="35" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="9.5" font-weight="900" fill="white">PLUS PLAN</text>
    <text x="120" y="35" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="14" font-weight="800" fill="#34d399">Manual 2FA Login Upgrade on Customer Email</text>

    <!-- 3 Step Horizontal Pipeline -->
