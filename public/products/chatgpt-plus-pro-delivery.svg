      <text x="0" y="36" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="10.5" fill="#94a3b8">Enter your personal ChatGPT email address at checkout.</text>
      <text x="0" y="52" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="10" fill="#64748b">No password required during checkout.</text>

      <text x="230" y="24" font-family="sans-serif" font-size="18" fill="#10a37f" opacity="0.6">→</text>

      <text x="260" y="18" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="11" font-weight="800" fill="#10a37f">Step 2: Live Chat / Ticket 2FA</text>
      <text x="260" y="36" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="10.5" fill="#94a3b8">Our engineer connects via Live Chat / Ticket</text>
      <text x="260" y="52" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="10" fill="#64748b">to request the one-time 2FA login verification code.</text>

      <text x="500" y="24" font-family="sans-serif" font-size="18" fill="#10a37f" opacity="0.6">→</text>

      <text x="530" y="18" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="11" font-weight="800" fill="#10a37f">Step 3: Plus Activated</text>
      <text x="530" y="36" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="10.5" fill="#94a3b8">Your personal account is upgraded</text>
      <text x="530" y="52" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="10" fill="#34d399">100% validity guarantee applied for full duration.</text>
