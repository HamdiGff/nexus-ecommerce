  </g>

  <!-- Bottom Strip -->
  <rect x="0" y="460" width="800" height="40" fill="#050810"/>
  <text x="50" y="484" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="11" fill="#475569">Average Delivery SLA: 18 Minutes  •  Active Order Live Chat Desk Available 24/7  •  Full Replacement Guarantee</text>
  <text x="660" y="484" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="11" font-weight="800" fill="#10a37f">NEXUS VAULT</text>
</svg>
