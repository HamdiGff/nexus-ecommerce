<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" preserveAspectRatio="xMidYMid slice" width="100%" height="100%">
  <defs>
    <linearGradient id="tbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08070d" />
      <stop offset="50%" stop-color="#140a17" />
      <stop offset="100%" stop-color="#06050a" />
    </linearGradient>

    <radialGradient id="tbGlow" cx="60%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#d30043" stop-opacity="0.25" />
      <stop offset="40%" stop-color="#9333ea" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <pattern id="tbGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#d30043" stroke-width="1" stroke-opacity="0.06" />
    </pattern>

    <filter id="glowPink" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#d30043" flood-opacity="0.45" />
    </filter>

    <filter id="shadowCardTb" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000000" flood-opacity="0.75" />
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#tbBg)" />
  <rect width="1200" height="750" fill="url(#tbGrid)" />
  <rect width="1200" height="750" fill="url(#tbGlow)" />

  <!-- Top Badge Header -->
  <g transform="translate(60, 45)">
    <rect width="350" height="36" rx="18" fill="#1e0b17" fill-opacity="0.7" stroke="#d30043" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="20" cy="18" r="5" fill="#ff3366" />
    <text x="35" y="23" fill="#fbcfe8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1">FULL THEME BUILDER &amp; 100+ PRO WIDGETS</text>
  </g>

  <!-- Title & Subtitle -->
  <g transform="translate(60, 115)">
    <text x="0" y="32" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.5">
      Complete Visual Theme Builder Architecture
    </text>
    <text x="0" y="62" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500">
      Design every single section of your WordPress site without writing PHP, HTML, or CSS code.
    </text>
  </g>

  <!-- Left: Visual Theme Builder Blueprint Canvas -->
  <g transform="translate(60, 210)" filter="url(#shadowCardTb)">
    <rect width="660" height="470" rx="24" fill="#0e0814" fill-opacity="0.95" stroke="#2d1020" stroke-width="1.5" />

    <!-- Blueprint Canvas Header -->
    <g transform="translate(24, 20)">
      <text x="0" y="16" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="800">
        WordPress Site Template Hierarchy
      </text>
      <text x="0" y="34" fill="#94a3b8" font-family="sans-serif" font-size="11">
        Dynamically controlled by Elementor Pro conditional display rules
      </text>
    </g>

    <!-- Visual Page Wireframe Stack -->
    <g transform="translate(24, 65)">
      <!-- 1. Header Template -->
      <g transform="translate(0, 0)">
        <rect width="612" height="60" rx="12" fill="#1b0a18" stroke="#d30043" stroke-width="1.5" />
        <rect x="18" y="15" width="90" height="30" rx="6" fill="#d30043" fill-opacity="0.3" />
        <text x="63" y="34" fill="#ff4d79" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle">LOGO</text>
        <!-- Nav items -->
        <rect x="220" y="24" width="55" height="12" rx="4" fill="#ffffff" fill-opacity="0.2" />
        <rect x="290" y="24" width="55" height="12" rx="4" fill="#ffffff" fill-opacity="0.2" />
        <rect x="360" y="24" width="55" height="12" rx="4" fill="#ffffff" fill-opacity="0.2" />
        <!-- Call to action button -->
        <rect x="490" y="17" width="104" height="26" rx="13" fill="#d30043" />
        <text x="542" y="34" fill="#ffffff" font-family="sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">Header (Global)</text>
      </g>

      <!-- 2. Single Post & Dynamic Loop Body -->
      <g transform="translate(0, 72)">
        <rect width="612" height="230" rx="14" fill="#140713" stroke="#3d1428" stroke-width="1" />
        
        <!-- Left Hero Area in body -->
        <g transform="translate(20, 20)">
          <rect width="360" height="120" rx="10" fill="#200a1c" stroke="#4a1932" stroke-width="1" />
          <text x="16" y="28" fill="#fda4af" font-family="sans-serif" font-size="12" font-weight="800">Dynamic Hero / Title</text>
          <text x="16" y="48" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">{post_title} • Author: {post_author}</text>
          <rect x="16" y="65" width="220" height="10" rx="5" fill="#ffffff" fill-opacity="0.15" />
          <rect x="16" y="85" width="180" height="10" rx="5" fill="#ffffff" fill-opacity="0.15" />
        </g>

        <!-- Right WooCommerce / Sidebar Widget -->
        <g transform="translate(400, 20)">
          <rect width="192" height="188" rx="10" fill="#200a1c" stroke="#4a1932" stroke-width="1" />
          <text x="16" y="28" fill="#f43f5e" font-family="sans-serif" font-size="11.5" font-weight="800">WooCommerce Pro</text>
          <rect x="16" y="42" width="160" height="70" rx="6" fill="#10050e" />
          <text x="96" y="80" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Product Gallery Widget</text>
          <rect x="16" y="122" width="160" height="24" rx="6" fill="#10b981" />
          <text x="96" y="138" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">Custom Add To Cart</text>
          <text x="96" y="166" fill="#94a3b8" font-family="sans-serif" font-size="9.5" text-anchor="middle">Dynamic Price: {woo_price}</text>
        </g>

        <!-- Left Bottom 2 Custom Loops -->
        <g transform="translate(20, 152)">
          <rect width="170" height="56" rx="8" fill="#1b0817" stroke="#331122" stroke-width="1" />
          <text x="12" y="24" fill="#e2e8f0" font-family="sans-serif" font-size="10" font-weight="700">Loop Grid Item 01</text>
          <text x="12" y="42" fill="#94a3b8" font-family="sans-serif" font-size="9">Dynamic ACF meta field</text>
        </g>
        <g transform="translate(200, 152)">
          <rect width="180" height="56" rx="8" fill="#1b0817" stroke="#331122" stroke-width="1" />
          <text x="12" y="24" fill="#e2e8f0" font-family="sans-serif" font-size="10" font-weight="700">Loop Grid Item 02</text>
          <text x="12" y="42" fill="#94a3b8" font-family="sans-serif" font-size="9">Custom post taxonomy</text>
        </g>
      </g>

      <!-- 3. Footer Template -->
      <g transform="translate(0, 314)">
        <rect width="612" height="60" rx="12" fill="#1b0a18" stroke="#d30043" stroke-width="1.5" />
        <rect x="20" y="20" width="140" height="20" rx="6" fill="#ffffff" fill-opacity="0.1" />
        <rect x="200" y="20" width="100" height="20" rx="6" fill="#ffffff" fill-opacity="0.1" />
        <rect x="340" y="20" width="100" height="20" rx="6" fill="#ffffff" fill-opacity="0.1" />
        <rect x="475" y="17" width="118" height="26" rx="13" fill="#d30043" />
        <text x="534" y="34" fill="#ffffff" font-family="sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">Footer (Global)</text>
      </g>
    </g>
  </g>

  <!-- Right: 100+ Pro Widgets Palette -->
  <g transform="translate(750, 210)">
    <rect width="390" height="470" rx="24" fill="#0e0814" fill-opacity="0.95" stroke="#2d1020" stroke-width="1.5" />
    
    <g transform="translate(24, 24)">
      <text x="0" y="20" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="800">
        Top Pro Widgets Palette
      </text>
      <text x="0" y="40" fill="#94a3b8" font-family="sans-serif" font-size="12">
        Instant drag-and-drop visual building blocks:
      </text>
    </g>

    <!-- Widgets List -->
    <g transform="translate(24, 85)">
      <!-- Widget 1: Forms -->
      <g transform="translate(0, 0)">
        <rect width="342" height="52" rx="12" fill="#1c0919" stroke="#d30043" stroke-width="1" stroke-opacity="0.3" />
        <text x="18" y="26" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">📝 Pro Form Builder</text>
        <text x="18" y="42" fill="#94a3b8" font-family="sans-serif" font-size="11">Multi-step, Zapier &amp; Mailchimp Webhooks</text>
      </g>

      <!-- Widget 2: Posts & Loop Grid -->
      <g transform="translate(0, 62)">
        <rect width="342" height="52" rx="12" fill="#1c0919" stroke="#d30043" stroke-width="1" stroke-opacity="0.3" />
        <text x="18" y="26" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">🔁 Loop Builder &amp; Posts Grid</text>
        <text x="18" y="42" fill="#94a3b8" font-family="sans-serif" font-size="11">Custom query, pagination, &amp; ACF binding</text>
      </g>

      <!-- Widget 3: Popup Builder -->
      <g transform="translate(0, 124)">
        <rect width="342" height="52" rx="12" fill="#1c0919" stroke="#d30043" stroke-width="1" stroke-opacity="0.3" />
        <text x="18" y="26" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">⚡ Exit-Intent Popup Builder</text>
        <text x="18" y="42" fill="#94a3b8" font-family="sans-serif" font-size="11">Scroll triggers, time delay, &amp; modal overlays</text>
      </g>

      <!-- Widget 4: WooCommerce Elements -->
      <g transform="translate(0, 186)">
        <rect width="342" height="52" rx="12" fill="#1c0919" stroke="#d30043" stroke-width="1" stroke-opacity="0.3" />
        <text x="18" y="26" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">🛍️ WooCommerce Shop &amp; Checkout</text>
        <text x="18" y="42" fill="#94a3b8" font-family="sans-serif" font-size="11">Product images, Add-to-cart, My Account</text>
      </g>

      <!-- Widget 5: Motion Effects & Lottie -->
      <g transform="translate(0, 248)">
        <rect width="342" height="52" rx="12" fill="#1c0919" stroke="#d30043" stroke-width="1" stroke-opacity="0.3" />
        <text x="18" y="26" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">✨ Motion Effects &amp; Lottie</text>
        <text x="18" y="42" fill="#94a3b8" font-family="sans-serif" font-size="11">Parallax scrolling, 3D tilt, &amp; SVG animations</text>
      </g>

      <!-- Bottom Pill -->
      <g transform="translate(0, 314)">
        <rect width="342" height="42" rx="10" fill="#d30043" fill-opacity="0.15" stroke="#d30043" stroke-opacity="0.4" />
        <circle cx="20" cy="21" r="5" fill="#ff3366" />
        <text x="34" y="25" fill="#fbcfe8" font-family="sans-serif" font-size="11" font-weight="700">300+ Designer Pro Template Kits Included</text>
      </g>
    </g>
  </g>
</svg>
