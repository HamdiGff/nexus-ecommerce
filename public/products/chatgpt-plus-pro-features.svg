    <rect width="335" height="280" rx="20" fill="none" stroke="#8b5cf6" stroke-width="1.5"/>
    <rect width="335" height="3" rx="1.5" fill="#8b5cf6"/>

    <text x="24" y="38" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="20" font-weight="900" fill="#a78bfa">ChatGPT Pro</text>
