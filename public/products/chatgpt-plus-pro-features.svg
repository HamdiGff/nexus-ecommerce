  <!-- Header -->
  <text x="50" y="55" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="11" font-weight="800" fill="#10a37f" letter-spacing="3">COMPARISON MATRIX</text>
  <text x="50" y="95" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="32" font-weight="900" fill="white" letter-spacing="-1">ChatGPT Plus vs. ChatGPT Pro</text>
  <text x="50" y="122" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="14" fill="#64748b">Both activated on your personal email address with full validity protection.</text>

  <!-- Left Column: ChatGPT Plus -->
  <g transform="translate(50, 150)">
    <rect width="335" height="280" rx="20" fill="#091414"/>
    <rect width="335" height="280" rx="20" fill="none" stroke="#10a37f" stroke-width="1.5"/>
    <rect width="335" height="3" rx="1.5" fill="#10a37f"/>

    <div xmlns="http://www.w3.org/1999/xhtml">
      <!-- Title -->
    </div>
    <text x="24" y="38" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="20" font-weight="900" fill="#10a37f">ChatGPT Plus</text>
    <text x="24" y="58" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#94a3b8">Personal 2FA Manual Setup · From $14.99/mo</text>

    <!-- Inclusions list -->
    <g transform="translate(24, 80)">
      <circle cx="5" cy="5" r="3" fill="#10a37f"/>
      <text x="18" y="9" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="12" fill="#e2e8f0">Delivery: 15–30 Mins (Live 2FA Handshake)</text>
    </g>
    <g transform="translate(24, 110)">
      <circle cx="5" cy="5" r="3" fill="#10a37f"/>
      <text x="18" y="9" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="12" fill="#e2e8f0">Models: GPT-4o &amp; GPT-4 standard limits</text>
    </g>
    <g transform="translate(24, 140)">
      <circle cx="5" cy="5" r="3" fill="#10a37f"/>
      <text x="18" y="9" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="12" fill="#e2e8f0">Creative: Full DALL·E 3 Image Generation</text>
    </g>
    <g transform="translate(24, 170)">
      <circle cx="5" cy="5" r="3" fill="#10a37f"/>
      <text x="18" y="9" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="12" fill="#e2e8f0">Tools: Python Code Interpreter &amp; Browsing</text>
    </g>
    <g transform="translate(24, 200)">
      <circle cx="5" cy="5" r="3" fill="#10a37f"/>
      <text x="18" y="9" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="12" fill="#e2e8f0">Agents: Custom GPTs Creation &amp; Store</text>
    </g>
    <g transform="translate(24, 230)">
