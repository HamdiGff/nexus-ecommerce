    <g transform="translate(24, 170)">
      <circle cx="5" cy="5" r="3" fill="#a78bfa"/>
      <text x="18" y="9" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="12" fill="#e2e8f0">Memory: Maximum Context Length for Long Docs</text>
    </g>
    <g transform="translate(24, 200)">
      <circle cx="5" cy="5" r="3" fill="#a78bfa"/>
      <text x="18" y="9" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="12" fill="#e2e8f0">Priority: Dedicated High-Speed Compute Cluster</text>
    </g>
    <g transform="translate(24, 230)">
      <circle cx="5" cy="5" r="3" fill="#a78bfa"/>
      <text x="18" y="9" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#c084fc">✓ Best for researchers, enterprises &amp; heavy AI users</text>
    </g>
