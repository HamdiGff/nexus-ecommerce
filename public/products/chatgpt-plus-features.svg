    <rect width="148" height="2" rx="1" fill="#10a37f" opacity="0.6"/>
    <text x="14" y="34" font-size="22" font-family="sans-serif">🤖</text>
    <text x="14" y="62" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="white">GPT-4o Model</text>
    <text x="14" y="78" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="10" fill="#6b7280">Most advanced</text>
    <text x="14" y="92" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="10" fill="#6b7280">reasoning AI</text>
  </g>

  <!-- Feature 2 -->
