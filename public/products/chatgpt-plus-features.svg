<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#080e18"/>
      <stop offset="100%" stop-color="#061210"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="800" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a1f18"/>
      <stop offset="100%" stop-color="#0a1218"/>
    </linearGradient>
    <radialGradient id="glow2" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#10a37f" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="800" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="50%" stop-color="#10a37f"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
  </defs>
  
  <rect width="800" height="500" fill="url(#bg2)"/>
