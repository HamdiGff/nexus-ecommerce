    <rect width="148" height="108" rx="12" fill="#0d1a14"/>
    <rect width="148" height="108" rx="12" fill="none" stroke="#1a3028" stroke-width="1"/>
    <rect width="148" height="2" rx="1" fill="#10a37f" opacity="0.6"/>
