  <line x1="0" y1="458" x2="800" y2="458" stroke="#10a37f" stroke-width="0.5" opacity="0.15"/>
  <text x="60" y="484" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="11" fill="#374151">ChatGPT Plus · GPT-4o · DALL·E 3 · Code Interpreter · Web Browsing · Custom GPTs</text>
  <text x="640" y="484" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#10a37f">NEXUS Digital</text>
</svg>
